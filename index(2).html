<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1311">
<title>GST Calculator</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 600; font-display: swap; src: url("fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 700; font-display: swap; src: url("fonts/bricolage-grotesque-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 500; font-display: swap; src: url("fonts/hanken-grotesk-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 600; font-display: swap; src: url("fonts/hanken-grotesk-latin-600-normal.woff2") format("woff2"); }

/* Layout: one tall screen for a 20:9 phone. Amount display on top, the result for the last pressed rate below it, rate keys and number pad pinned at the bottom. */
:root {
  --bg: #0a1311;
  --panel: #101e1a;
  --line: #20352f;
  --key: #16221f;
  --key-n: #1b2a26;
  --fg: #e8f0ed;
  --mu: #6f867f;
  --teal: #3cc2a8;
  --teal-dk: #12352d;
  --teal-ln: #1f5a4c;
  --amber: #f0b36a;
  --amber-dk: #38261a;
  --amber-ln: #6a431f;
  --red: #ff8a7a;
  --kh: clamp(40px, 5.9dvh, 56px);
  --fd: "Bricolage Grotesque", system-ui, sans-serif;
  --fb: "Hanken Grotesk", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overscroll-behavior: none; }
body { font-family: var(--fb); font-size: 15px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }

.app {
  height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  background: linear-gradient(180deg, #0a1311 0%, #0c1714 55%, #08100e 100%);
}
.bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 4px; }
.bar b { font: 700 1.15rem var(--fd); letter-spacing: .01em; }
.bar b em { font-style: normal; color: var(--teal); }
.chip { font-size: .72rem; font-weight: 600; color: #7fe3cc; background: var(--teal-dk); border: 1px solid var(--teal-ln); padding: 4px 10px; border-radius: 999px; }

/* typed amount */
.entry { margin: 8px 14px 0; padding: 8px 18px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; }
.elabel { font-size: .68rem; font-weight: 600; letter-spacing: .1em; color: var(--mu); }
.edisp { display: flex; justify-content: flex-end; align-items: flex-end; height: 80px; overflow: hidden; }
.edisp .num { max-width: 100%; text-align: right; font: 700 var(--fs, 56px)/1.12 var(--fd); font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.edisp .num .rs { font-weight: 600; color: var(--mu); margin-right: .1em; }
.edisp .num .t { white-space: nowrap; }
.edisp .num.ph { color: #34463f; }
.caret { display: inline-block; width: 3px; height: .8em; background: var(--teal); border-radius: 2px; vertical-align: -.05em; margin-left: 3px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* result for the pressed rate */
.tape { flex: 1; min-height: 0; overflow: hidden; padding: 10px 22px 4px; display: flex; flex-direction: column; gap: 4px; }
.rows { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 3px; }
.ln { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; font-size: .96rem; }
.ln .lb { color: var(--mu); }
.ln.first .lb, .ln.first .v { color: #c9d6d2; }
.ln.tax .lb { font-weight: 600; }
.app[data-mode="plus"] .ln.tax .lb { color: var(--teal); }
.app[data-mode="minus"] .ln.tax .lb { color: var(--amber); }
.ln.sub .v { color: #9db3ab; }
.pill { flex: none; margin-top: 6px; padding: 9px 16px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pill span { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.pill b { font: 700 1.5rem var(--fd); font-variant-numeric: tabular-nums; }
.app[data-mode="plus"] .pill { background: linear-gradient(90deg, #14463b, #1b6a58); color: #d9fff5; }
.app[data-mode="minus"] .pill { background: linear-gradient(90deg, #4a2e17, #7a4a1f); color: #ffe9d0; }
@media (max-height: 700px) { .hint { display: none; } }
.empty { color: var(--mu); text-align: center; margin-top: 18px; font-size: .95rem; }

.hint { padding: 6px 22px 8px; color: #5f766f; font-size: .68rem; text-align: center; letter-spacing: .06em; text-transform: uppercase; }

/* keys */
.keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 0 14px 16px; }
.k { height: var(--kh); border-radius: 16px; display: grid; place-items: center; align-content: center; font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; background: var(--key); border: 1px solid #223530; transition: transform .08s, filter .08s; }
.k:active { transform: scale(.95); filter: brightness(1.25); }
.k small { display: block; font-size: .66rem; font-weight: 600; opacity: .8; margin-top: -2px; }
.k.n { font: 600 1.5rem var(--fd); background: var(--key-n); }
.k.p { background: var(--teal-dk); border-color: var(--teal-ln); color: #7fe3cc; }
.k.m { background: var(--amber-dk); border-color: var(--amber-ln); color: #f6c48c; }
.k.p.sel { background: var(--teal); border-color: var(--teal); color: #04201a; }
.k.m.sel { background: var(--amber); border-color: var(--amber); color: #2a1206; }
.k.f { color: var(--teal); background: #13201c; }
.k.cl { color: var(--red); background: #2a1a18; border-color: #5a2c26; }
.k.cp { background: var(--teal); border: 0; color: #04201a; font-weight: 700; }
.k.op { font: 600 1.7rem var(--fd); color: var(--fg); background: #1f2c27; }
.k.eq { background: #e8f0ed; border: 0; color: #0a1311; font: 700 1.7rem var(--fd); }
.live { min-height: 22px; text-align: right; color: var(--mu); font: 600 1rem var(--fb); font-variant-numeric: tabular-nums; }
.k svg { width: 26px; height: 26px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 40%); transform: translate(-50%, 10px); background: #e8f0ed; color: #0a1311; font-weight: 600; padding: 9px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* rate editor */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.backdrop[hidden] { display: none; }
.sheet { width: 100%; max-width: 520px; background: #0f1a17; border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.sheet h2 { margin: 0; font: 700 1.1rem var(--fd); }
.sheet .ssub { color: var(--mu); font-size: .85rem; margin-top: 2px; }
.sdisp { margin: 12px 0; padding: 8px 18px; background: var(--panel); border: 1.5px solid var(--teal); border-radius: 16px; display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; }
.sdisp b { font: 700 2.6rem var(--fd); font-variant-numeric: tabular-nums; }
.sdisp span { font: 600 1.5rem var(--fd); color: var(--mu); }
.spad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.spad .k { height: 54px; }
.srow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.srow .k { height: 52px; }
.srow .cancel { background: var(--key); }
.srow .save { background: var(--teal); color: #04201a; border: 0; font-weight: 700; }

@media (prefers-reduced-motion: reduce) { .caret { animation: none; } .k, .toast { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app" data-mode="plus">
  <header class="bar"><b>GST <em>Calculator</em></b><span class="chip">₹ INR</span></header>

  <section class="entry" aria-label="Amount">
    <div class="elabel">AMOUNT</div>
    <div class="edisp" id="edisp"><div class="num" id="num"></div></div>
    <div class="live" id="live"></div>
  </section>

  <section class="tape" id="tape" aria-live="polite"></section>

  <div class="hint">Long-press a rate key to change it</div>
  <div class="keys" id="keys"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" role="dialog" aria-label="Change GST rate">
    <h2>Change rate</h2>
    <div class="ssub" id="ssub"></div>
    <div class="sdisp"><b id="sval">0</b><span>%</span></div>
    <div class="spad" id="spad"></div>
    <div class="srow"><button type="button" class="k cancel" id="scancel">Cancel</button><button type="button" class="k save" id="ssave">Save</button></div>
  </div>
</div>

<script>
(function () {
  var DEFAULTS = [3, 5, 12, 18, 40];
  var STORE = 'gst-app-rates';
  var BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>';

  var rates = loadRates();
  var st = { expr: '', mode: 'plus', slot: 3, fresh: false };

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), numEl = $('num'), edispEl = $('edisp'), tape = $('tape'), keysEl = $('keys'), toastEl = $('toast');
  var nf = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function loadRates() {
    try {
      var a = JSON.parse(localStorage.getItem(STORE));
      if (Array.isArray(a) && a.length === 5 && a.every(function (n) { return typeof n === 'number' && n >= 0 && n <= 100; })) return a;
    } catch (e) {}
    return DEFAULTS.slice();
  }
  function saveRates() { try { localStorage.setItem(STORE, JSON.stringify(rates)); } catch (e) {} }
  function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function pct(r) { return String(+r.toFixed(3)); }
  function money(paise) { return (paise < 0 ? '\u2212' : '') + '₹ ' + nf.format(Math.abs(paise) / 100); }
  function group(i) {
    if (i.length <= 3) return i;
    return i.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + i.slice(-3);
  }
  function typed(s) {
    if (!s) return '0';
    var p = s.split('.');
    return group(p[0] || '0') + (p.length > 1 ? '.' + p[1] : '');
  }

  /* ---------- amount expression (+ - x /) ---------- */
  var OPS = '+-*/';
  function isOp(c) { return OPS.indexOf(c) > -1; }
  function hasOp(s) {
    for (var i = 0; i < s.length; i++) if (isOp(s[i]) && !(i === 0 && s[i] === '-')) return true;
    return false;
  }
  function evaluate(s) {
    if (!s) return null;
    var toks = [], cur = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (isOp(ch) && !(i === 0 && ch === '-')) {
        if (cur === '' || cur === '-' || cur === '.') return null;
        toks.push(parseFloat(cur), ch); cur = '';
      } else cur += ch;
    }
    if (cur !== '' && cur !== '-' && cur !== '.') toks.push(parseFloat(cur));
    else if (toks.length) toks.pop();
    if (!toks.length) return null;
    var vals = [toks[0]], ops = [];
    for (var j = 1; j < toks.length; j += 2) {
      var op = toks[j], nn = toks[j + 1];
      if (op === '*') vals[vals.length - 1] *= nn;
      else if (op === '/') { if (nn === 0) return NaN; vals[vals.length - 1] /= nn; }
      else { ops.push(op); vals.push(nn); }
    }
    var r = vals[0];
    for (var k = 0; k < ops.length; k++) r = ops[k] === '+' ? r + vals[k + 1] : r - vals[k + 1];
    return Math.round(r * 100) / 100;
  }
  function value() { return evaluate(st.expr); }
  function hasAmount() { var v = value(); return v !== null && isFinite(v) && v !== 0; }
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  function fmtNum(t) {
    var neg = t.charAt(0) === '-';
    if (neg) t = t.slice(1);
    return (neg ? '−' : '') + typed(t);
  }
  function fmtExpr(s) {
    var out = '', cur = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (isOp(ch) && !(i === 0 && ch === '-')) { out += fmtNum(cur) + ' ' + SYM[ch] + ' '; cur = ''; }
      else cur += ch;
    }
    return (out + (cur === '' ? '' : fmtNum(cur))).replace(/\s+$/, '');
  }

  function terms(s) {
    var out = [], cur = '', pre = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (isOp(ch) && !(i === 0 && ch === '-')) { out.push(pre + fmtNum(cur)); pre = SYM[ch] + ' '; cur = ''; }
      else cur += ch;
    }
    out.push(pre + (cur === '' ? '' : fmtNum(cur)));
    return out;
  }
  function exprHtml() {
    var body = st.expr ? terms(st.expr).map(function (t) { return '<span class="t">' + t + '</span>'; }).join(' ') : '0';
    return '<span class="rs">₹</span> ' + body + '<span class="caret"></span>';
  }
  /* keep the whole entry visible: shrink the text until it fits the fixed display */
  function fit() {
    var fs = 56;
    numEl.style.setProperty('--fs', fs + 'px');
    while (numEl.offsetHeight > edispEl.clientHeight && fs > 16) { fs -= 2; numEl.style.setProperty('--fs', fs + 'px'); }
  }

  /* ---------- build keys ---------- */
  var html = '';
  function rateKey(sign, i) {
    var cls = sign === '+' ? 'p' : 'm', s = sign === '+' ? '+' : '−';
    return '<button type="button" class="k ' + cls + '" data-act="rate" data-sign="' + sign + '" data-slot="' + i + '"></button>';
  }
  for (var i = 0; i < 5; i++) html += rateKey('+', i);
  for (i = 0; i < 5; i++) html += rateKey('-', i);
  function nk(v) { return '<button type="button" class="k n" data-act="d" data-v="' + v + '">' + v + '</button>'; }
  function ok(v, label) { return '<button type="button" class="k n op" data-act="op" data-v="' + v + '" aria-label="' + label + '">' + label + '</button>'; }
  html += nk('7') + nk('8') + nk('9') + ok('/', '÷') + '<button type="button" class="k f" data-act="back" aria-label="Backspace">' + BACK + '</button>';
  html += nk('4') + nk('5') + nk('6') + ok('*', '×') + '<button type="button" class="k cl" data-act="clear">Clear</button>';
  html += nk('1') + nk('2') + nk('3') + ok('-', '−') + '<button type="button" class="k cp" data-act="copy">Copy</button>';
  html += nk('0') + nk('00') + nk('.') + ok('+', '+') + '<button type="button" class="k eq" data-act="eq" aria-label="Equals">=</button>';
  keysEl.innerHTML = html;

  /* ---------- calculation ---------- */
  function calc() {
    var amt = Math.round((value() || 0) * 100);
    var r = rates[st.slot], base, gst, total, result;
    if (st.mode === 'plus') {
      base = amt; gst = Math.round(amt * r / 100); total = base + gst; result = total;
    } else {
      total = amt; base = Math.round(amt * 100 / (100 + r)); gst = total - base; result = base;
    }
    var cg = Math.round(gst / 2);
    return { amt: amt, r: r, gst: gst, cgst: cg, sgst: gst - cg, result: result };
  }

  function lines() {
    var c = calc(), plus = st.mode === 'plus', sign = plus ? '+' : '−', h = c.r / 2;
    return {
      c: c,
      rows: [
        ['Amount', money(c.amt), 'first'],
        [sign + ' GST ' + pct(c.r) + '%', money(c.gst), 'tax'],
        ['CGST ' + pct(h) + '%', money(c.cgst), 'sub'],
        ['SGST ' + pct(h) + '%', money(c.sgst), 'sub']
      ],
      label: plus ? 'With GST' : 'Without GST'
    };
  }

  /* ---------- render ---------- */
  function render() {
    app.setAttribute('data-mode', st.mode);

    numEl.innerHTML = exprHtml();
    numEl.classList.toggle('ph', !st.expr);
    fit();
    var v = value(), live = '';
    if (hasOp(st.expr) && v !== null) live = isFinite(v) ? '= ' + (v < 0 ? '\u2212' : '') + '\u20B9 ' + nf.format(Math.abs(v)) : 'Cannot divide by zero';
    $('live').textContent = live;

    keysEl.querySelectorAll('[data-act="rate"]').forEach(function (b) {
      var i = +b.dataset.slot, plus = b.dataset.sign === '+', s = plus ? '+' : '−';
      b.innerHTML = i === 4 ? s + 'GST<small>' + pct(rates[i]) + '%</small>' : s + pct(rates[i]) + '%';
      b.classList.toggle('sel', (plus ? 'plus' : 'minus') === st.mode && i === st.slot);
    });

    if (!hasAmount()) {
      tape.innerHTML = '<div class="empty">Type an amount, then tap a GST rate key</div>';
      return;
    }
    var L = lines();
    tape.innerHTML = '<div class="rows">' + L.rows.map(function (r) {
      return '<div class="ln ' + r[2] + '"><span class="lb">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
    }).join('') + '</div><div class="pill"><span>' + L.label + '</span><b>' + money(L.c.result) + '</b></div>';
  }

  /* ---------- amount input ---------- */
  function input(ch) {
    if (st.fresh) { st.expr = ''; st.fresh = false; }
    var e = st.expr, idx = -1;
    for (var i = e.length - 1; i >= 0; i--) { if (isOp(e[i])) { idx = i; break; } }
    var prefix = e.slice(0, idx + 1), a = e.slice(idx + 1), dot = a.indexOf('.');
    if (ch === '.') {
      if (dot > -1) return;
      a = a === '' ? '0.' : a + '.';
    } else {
      if (dot > -1) {
        var dec = a.length - dot - 1;
        if (dec >= 2) return;
        if (ch === '00') ch = dec === 0 ? '00' : '0';
      } else {
        if (a === '0') { if (ch === '0' || ch === '00') return; a = ''; }
        if (a === '' && ch === '00') return;
        if (a.length >= 11) return;
        if (a.length + ch.length > 11) ch = ch.slice(0, 11 - a.length);
      }
      a += ch;
    }
    if ((prefix + a).length > 60) return;
    st.expr = prefix + a;
    render();
  }

  function addOp(op) {
    st.fresh = false;
    var e = st.expr;
    if (e === '' || e === '-') return;
    var last = e[e.length - 1];
    if (last === '.') return;
    if (isOp(last)) e = e.slice(0, -1);
    if (e === '') return;
    st.expr = e + op;
    render();
  }

  function equals() {
    if (!hasOp(st.expr)) return;
    var v = value();
    if (v === null) return;
    if (!isFinite(v)) { toast('Cannot divide by zero'); return; }
    if (Math.abs(v) >= 1e12) { toast('Number too large'); return; }
    st.expr = String(v);
    st.fresh = true;
    render();
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.classList.remove('on'); }, 1400);
  }

  function summary() {
    var L = lines();
    return ['GST Calculator'].concat(L.rows.map(function (r) { return r[0] + ': ' + r[1]; }))
      .concat([L.label + ': ' + money(L.c.result)]).join('\n');
  }
  function copyText(text) {
    function fallback() {
      try {
        var t = document.createElement('textarea');
        t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
        toast('Copied');
      } catch (e) { toast('Could not copy'); }
    }
    try {
      navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    } catch (e) { fallback(); }
  }

  function press(b) {
    var act = b.dataset.act;
    vib(8);
    if (act === 'd') input(b.dataset.v);
    else if (act === 'op') addOp(b.dataset.v);
    else if (act === 'eq') equals();
    else if (act === 'back') { st.fresh = false; st.expr = st.expr.slice(0, -1); if (st.expr === '-') st.expr = ''; render(); }
    else if (act === 'clear') { st.fresh = false; st.expr = ''; render(); }
    else if (act === 'copy') {
      if (!hasAmount()) toast('Type an amount first');
      else copyText(summary());
    } else if (act === 'rate') {
      st.mode = b.dataset.sign === '+' ? 'plus' : 'minus';
      st.slot = +b.dataset.slot;
      render();
    }
  }

  /* ---------- tap vs long-press on keys ---------- */
  var timer = null, longFired = false, sx = 0, sy = 0;
  function cancelTimer() { clearTimeout(timer); timer = null; }
  keysEl.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.k');
    longFired = false;
    if (!b || b.dataset.act !== 'rate') return;
    sx = e.clientX; sy = e.clientY;
    cancelTimer();
    timer = setTimeout(function () {
      timer = null; longFired = true; vib(25); openSheet(+b.dataset.slot);
    }, 500);
  });
  keysEl.addEventListener('pointermove', function (e) {
    if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancelTimer();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { keysEl.addEventListener(ev, cancelTimer); });
  keysEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  keysEl.addEventListener('click', function (e) {
    var b = e.target.closest('.k');
    if (!b) return;
    if (longFired) { longFired = false; return; }
    press(b);
  });

  /* ---------- rate editor (own keypad, no phone keyboard) ---------- */
  var backdrop = $('backdrop'), sval = $('sval'), ssub = $('ssub'), spad = $('spad');
  var editSlot = 0, editStr = '', openedAt = 0;
  var sp = '';
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0'].forEach(function (d) { sp += '<button type="button" class="k n" data-sd="' + d + '">' + d + '</button>'; });
  sp += '<button type="button" class="k f" data-sd="back" aria-label="Backspace">' + BACK + '</button>';
  spad.innerHTML = sp;

  function showEdit() { sval.textContent = editStr === '' ? '0' : editStr; }
  function openSheet(i) {
    editSlot = i; editStr = pct(rates[i]); openedAt = Date.now();
    ssub.textContent = '+' + (i === 4 ? 'GST' : pct(rates[i]) + '%') + '  and  −' + (i === 4 ? 'GST' : pct(rates[i]) + '%') + ' use the same rate';
    showEdit();
    backdrop.hidden = false;
  }
  function closeSheet() { backdrop.hidden = true; }
  spad.addEventListener('click', function (e) {
    var b = e.target.closest('[data-sd]');
    if (!b) return;
    vib(8);
    var d = b.dataset.sd;
    if (d === 'back') editStr = editStr.slice(0, -1);
    else if (d === '.') { if (editStr.indexOf('.') === -1) editStr = editStr === '' ? '0.' : editStr + '.'; }
    else {
      var nxt = (editStr === '0' ? '' : editStr) + d;
      var dot = nxt.indexOf('.');
      if (dot > -1 && nxt.length - dot - 1 > 3) return;
      if (parseFloat(nxt) > 100) return;
      editStr = nxt;
    }
    showEdit();
  });
  $('ssave').addEventListener('click', function () {
    var v = parseFloat(editStr);
    if (!isFinite(v)) { toast('Type a rate first'); return; }
    rates[editSlot] = Math.min(100, Math.max(0, v));
    saveRates(); closeSheet(); render(); toast('Rate saved');
  });
  $('scancel').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop && Date.now() - openedAt > 400) closeSheet();
  });

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
