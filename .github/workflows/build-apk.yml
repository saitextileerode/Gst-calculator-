      - name: Copy web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GST-Calculator.apk

      - name: Save APK as download
        uses: actions/upload-artifact@v4
        with:
          name: GST-Calculator-APK
          path: GST-Calculator.apk

      - name: Publish APK in Releases (direct download link)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" GST-Calculator.apk \
            --title "GST Calculator build ${{ github.run_number }}" \
            --notes "Download GST-Calculator.apk and install it on your phone."
