name: Build GST Calculator APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project
        run: |
          test -f index.html || { echo "index.html is missing in the repository root"; exit 1; }
          mkdir -p www/fonts
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1 @fontsource/bricolage-grotesque@5.3.0 @fontsource/hanken-grotesk@5.3.0
          cp node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-600-normal.woff2 www/fonts/
          cp node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-700-normal.woff2 www/fonts/
          cp node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-500-normal.woff2 www/fonts/
          cp node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-600-normal.woff2 www/fonts/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.gstcalc.app",
            "appName": "GST Calculator",
            "webDir": "www",
            "backgroundColor": "#0a1311",
            "server": { "androidScheme": "https" },
            "android": { "backgroundColor": "#0a1311" }
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Apply app look (icon, dark bars, portrait)
        run: |
          python3 - <<'PY'
          """Run after `npx cap add android`. Applies the app's look: dark bars, dark splash,
          portrait lock and a custom launcher icon. Usage: python3 scripts/patch_android.py"""
          import pathlib, re, sys

          root = pathlib.Path("android/app/src/main")
          if not root.exists():
              sys.exit("android/ folder not found - run `npx cap add android` first")
          res = root / "res"

          # 1) colors
          (res / "values" / "gst_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="gst_bg">#1B1113</color>\n'
              '</resources>\n', encoding="utf-8")

          # 2) theme: dark status bar + navigation bar, dark splash background
          styles = res / "values" / "styles.xml"
          s = styles.read_text(encoding="utf-8")
          s = s.replace(
              '<item name="android:background">@null</item>',
              '<item name="android:background">@null</item>\n'
              '        <item name="android:statusBarColor">@color/gst_bg</item>\n'
              '        <item name="android:navigationBarColor">@color/gst_bg</item>\n'
              '        <item name="android:windowLightStatusBar">false</item>\n'
              '        <item name="android:windowBackground">@color/gst_bg</item>', 1)
          s = s.replace('<item name="android:background">@drawable/splash</item>',
                        '<item name="android:background">@color/gst_bg</item>')
          styles.write_text(s, encoding="utf-8")

          # 3) portrait only
          manifest = root / "AndroidManifest.xml"
          m = manifest.read_text(encoding="utf-8")
          if "screenOrientation" not in m:
              m = m.replace('android:launchMode="singleTask"',
                            'android:launchMode="singleTask"\n            android:screenOrientation="portrait"', 1)
          manifest.write_text(m, encoding="utf-8")

          # 4) launcher icon (adaptive): % keycap with + - x = keys on a dark retro background
          (res / "drawable" / "ic_gst_foreground.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:pivotX="54" android:pivotY="54" android:scaleX="1.1" android:scaleY="1.1">
              <path android:fillColor="#2a181c" android:pathData="M8,54 a46,46 0 1,0 92,0 a46,46 0 1,0 -92,0"/>
              <path android:fillColor="#0d0708" android:pathData="M36.5,58.5 a17.5,17.5 0 1,0 35.0,0 a17.5,17.5 0 1,0 -35.0,0"/>
              <path android:fillColor="#e2c39c" android:pathData="M36.5,54 a17.5,17.5 0 1,0 35.0,0 a17.5,17.5 0 1,0 -35.0,0"/>
              <path android:fillColor="#f3dcc0" android:pathData="M38.8,54 a15.2,15.2 0 1,0 30.4,0 a15.2,15.2 0 1,0 -30.4,0"/>
              <path android:strokeColor="#3a2218" android:strokeWidth="3.3" android:strokeLineCap="round" android:pathData="M58.6,44.6 L49.4,63.4"/>
              <path android:strokeColor="#3a2218" android:strokeWidth="2.8" android:strokeLineCap="round" android:pathData="M45.800000000000004,47.2 a3.4,3.4 0 1,0 6.8,0 a3.4,3.4 0 1,0 -6.8,0"/>
              <path android:strokeColor="#3a2218" android:strokeWidth="2.8" android:strokeLineCap="round" android:pathData="M55.4,60.8 a3.4,3.4 0 1,0 6.8,0 a3.4,3.4 0 1,0 -6.8,0"/>
              <path android:fillColor="#0d0708" android:pathData="M28.8,38.2 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:fillColor="#eebb44" android:pathData="M28.8,36 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:strokeColor="#3a2218" android:strokeWidth="1.9" android:strokeLineCap="round" android:pathData="M36,32.4 V39.6 M32.4,36 H39.6"/>
              <path android:fillColor="#0d0708" android:pathData="M64.8,38.2 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:fillColor="#b85a35" android:pathData="M64.8,36 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:strokeColor="#fff0dc" android:strokeWidth="1.9" android:strokeLineCap="round" android:pathData="M68.4,36 H75.6"/>
              <path android:fillColor="#0d0708" android:pathData="M28.8,74.2 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:fillColor="#d9a273" android:pathData="M28.8,72 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:strokeColor="#3a2218" android:strokeWidth="1.9" android:strokeLineCap="round" android:pathData="M33.4,69.4 L38.6,74.6 M38.6,69.4 L33.4,74.6"/>
              <path android:fillColor="#0d0708" android:pathData="M64.8,74.2 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:fillColor="#ffffff" android:pathData="M64.8,72 a7.2,7.2 0 1,0 14.4,0 a7.2,7.2 0 1,0 -14.4,0"/>
              <path android:strokeColor="#2b1a1d" android:strokeWidth="1.9" android:strokeLineCap="round" android:pathData="M68.4,70.6 H75.6 M68.4,73.6 H75.6"/>
              </group>
          </vector>
          ''', encoding="utf-8")
          icon = ('<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <background android:drawable="@color/gst_bg"/>\n'
                  '    <foreground android:drawable="@drawable/ic_gst_foreground"/>\n'
                  '</adaptive-icon>\n')
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (res / "mipmap-anydpi-v26" / name).write_text(icon, encoding="utf-8")

          # same signing key + rising version number on every build, so new APKs install over the old app
          g = pathlib.Path("android/app/build.gradle")
          t = g.read_text(encoding="utf-8")
          t = t.replace('versionCode 1', 'versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")', 1)
          t = t.replace('versionName "1.0"', 'versionName "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"', 1)
          t = t.replace('android {\n    namespace', 'android {\n    signingConfigs {\n        debug {\n            storeFile file("gst-signing.jks")\n            storePassword "gstcalc123"\n            keyAlias "gstkey"\n            keyPassword "gstcalc123"\n            storeType "jks"\n        }\n    }\n    namespace', 1)
          g.write_text(t, encoding="utf-8")
          print("Android project patched.")
          PY

      - name: Add fixed signing key
        run: |
          base64 -d > android/app/gst-signing.jks <<'EOF'
